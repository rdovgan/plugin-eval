# Plugins under test. Versions (tags, branches, commits) come from the git repository `repo`.
plugins:
  java-developer:
    repo: ~/Desktop/projects/claude-plugins
    subdir: plugins/java-developer
    allow_tools: [Write, Edit]
  java-analyst:
    repo: ~/Desktop/projects/claude-plugins
    subdir: plugins/java-analyst
    # Writing to .claude/ is forbidden in a `claude plugin eval` run even with --allow-tools (dontAsk mode),
    # so the analyst's documents (.claude/analysis/) are not created during a run.
    allow_tools: [Write, Edit]
  qa-docs:
    repo: ~/Desktop/projects/claude-plugins
    subdir: plugins/qa-docs
    allow_tools: [Write, Edit]

# Directory inside the plugin's working copy where cases and mocks are copied.
eval_dir_name: pe-evals

runs: 1
# Parallel agent runs (1-8). All of them use your login and share one rate limit.
concurrency: 3
judge_model: haiku
timeout_per_invocation_sec: 7200

budget:
  per_invocation_usd: 20   # per evalkit.run invocation
  per_day_usd: 50          # total per calendar day, from results/ledger.jsonl

# java-developer hooks run `mvn test` after code edits. HOME is temporary during a run, so the
# synthetic project is built offline from this local Maven repository.
maven_repo_local: ~/.m2/repository

models:
  sonnet:
    model: claude-sonnet-5-5
  haiku:
    model: claude-haiku-5-5
  glm:
    model: glm-4.6
    env:                     # ${VAR} values come from the environment or .env
      ANTHROPIC_BASE_URL: ${GLM_BASE_URL}
      ANTHROPIC_AUTH_TOKEN: ${GLM_TOKEN}

smoke:
  tags: [smoke]
  runs: 1
