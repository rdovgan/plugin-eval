body: |
  A guest cancelled 30 hours before check-in and got only 50% back. According to our rules a
  cancellation 24 hours or more before check-in gets a full refund.

  Please fix the code so that a cancellation 24h or more before check-in is refunded 100%.

  Rules: see docs/cancellation-rules.md
